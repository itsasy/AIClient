[project]
name = "aiclient"
version = "0.1.0"
description = "Cliente IA Personal – Asistente de Desarrollo con Memoria Persistente"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tu Nombre", email = "tu@email.com"},
]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "google-genai>=2.10.0",
    "openai>=1.12.0",
    "flask>=3.0.0",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "ipykernel",
    "rich",
    "textual",
    "sentence-transformers",
    "numpy",
    "pypdf",
    "python-docx",
    "pillow",
    "pytest",
    "build",
    "twine",
]

[project.scripts]
ai = "cli.ai:main"

[project.urls]
Homepage = "https://github.com/tu_usuario/aiclient"
Repository = "https://github.com/tu_usuario/aiclient"
Issues = "https://github.com/tu_usuario/aiclient/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "cli",
    "core",
    "llm",
    "skills",
    "agents",
    "obsidian",
    "dashboard",
    "tui",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']