[project]
name = "aiclient"
version = "0.1.0"
description = "Cliente IA Personal – Asistente de Desarrollo con Memoria Persistente"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "google-genai>=2.10.0",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "ipykernel",
    "rich",
    "textual",
    "sentence-transformers",
    "numpy",
    "pypdf",
    "python-docx",
    "pillow",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "cli",
    "core",
    "llm",
    "skills",
    "agents",
    "obsidian",
    "dashboard",
    "tui",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']