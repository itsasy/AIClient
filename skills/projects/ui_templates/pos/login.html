<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · POS</title>
  <link rel="stylesheet" href="./pos.css" />
  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" id="loginForm">
      <div class="brand">
        <div class="logo">P</div>
        <h1>Bienvenido de vuelta</h1>
        <p>Punto de venta y gestión. La operación puede seguir incluso sin Internet.</p>
      </div>
      <label>USUARIO</label>
      <input id="email" name="email" type="text" placeholder="usuario@negocio.com" required />
      <label>CONTRASEÑA</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required />
      <div class="row"><input type="checkbox" id="r" checked /><label for="r" style="margin:0">Recordarme</label></div>
      <button class="btn-primary" type="submit">Iniciar sesión</button>
      <p class="msg" id="loginMsg" role="status"></p>
      <div class="footer"><span class="ok-dot">● Terminal verificado</span><span>v1.0</span></div>
    </form>
  </div>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
